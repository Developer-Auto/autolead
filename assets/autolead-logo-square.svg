<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1f2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080808;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3c5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3c5;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#0ea5a0;stop-opacity:0.06" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="60" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="400" height="400" rx="60" fill="none" stroke="#22d3c5" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Icon circle -->
  <circle cx="200" cy="155" r="72" fill="url(#iconBg)" stroke="url(#teal)" stroke-width="1.5"/>

  <!-- AL monogram -->
  <text x="200" y="174" font-family="'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="900" fill="url(#teal)" text-anchor="middle" letter-spacing="-2">AL</text>

  <!-- Small dots — leads flowing -->
  <circle cx="148" cy="218" r="5" fill="#22d3c5" opacity="0.9"/>
  <circle cx="168" cy="218" r="5" fill="#22d3c5" opacity="0.55"/>
  <circle cx="188" cy="218" r="5" fill="#22d3c5" opacity="0.3"/>

  <!-- Wordmark -->
  <text x="200" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    <tspan fill="#ffffff">Auto</tspan><tspan fill="url(#teal)">Lead</tspan>
  </text>

  <!-- Tagline -->
  <text x="200" y="328" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#22d3c5" text-anchor="middle" letter-spacing="3" opacity="0.6">LEAD AUTOMATION</text>
</svg>

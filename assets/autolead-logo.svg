<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3c5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3c5;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0ea5a0;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Icon background -->
  <rect x="0" y="8" width="64" height="64" rx="16" fill="url(#glowGrad)" stroke="url(#iconGrad)" stroke-width="1.5"/>

  <!-- Lightning bolt / lead arrow icon -->
  <g transform="translate(32,40)">
    <!-- Arrow up-right = lead converted -->
    <path d="M-10 12 L-10 -4 L2 -4 L-14 -20 L-14 -4 L-26 -4 Z" fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" transform="rotate(45) scale(0.72)"/>
    <!-- Dot = WhatsApp / contact -->
    <circle cx="10" cy="8" r="3.5" fill="url(#iconGrad)"/>
    <circle cx="10" cy="-4" r="3.5" fill="url(#iconGrad)" opacity="0.5"/>
    <circle cx="10" cy="-16" r="3.5" fill="url(#iconGrad)" opacity="0.25"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Auto</text>
  <text x="149" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="url(#iconGrad)">Lead</text>

  <!-- Tagline -->
  <text x="80" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#22d3c5" opacity="0.65">LEAD AUTOMATION</text>
</svg>
